syntax = "proto3";

package packagepb.v1;

option go_package = "github.com/example/thing-transfer/gen/packagepb/v1;packagepbv1";

// Facility checkpoint identifiers. New stations get appended at the end;
// never renumber or reuse a value once shipped, since old events on disk
// (Parquet, Kafka) and old consumers still reference the numeric tag.
enum StationType {
  STATION_TYPE_UNSPECIFIED = 0;
  STATION_TYPE_INTAKE = 1;
  STATION_TYPE_SORT_A = 2;
  STATION_TYPE_SORT_B = 3;
  STATION_TYPE_DISPATCH = 4;
  // Appended after the original four (see comment above on appending,
  // not renumbering) — fill out the facility's real linear chain:
  // INTAKE -> INDUCTION -> SORT_A -> SORT_B -> QC_CHECK -> STAGING -> DISPATCH.
  STATION_TYPE_INDUCTION = 5;
  STATION_TYPE_QC_CHECK = 6;
  STATION_TYPE_STAGING = 7;
}

// Physical dimensions in SI units. Kept as its own message (rather than
// inlined float fields on Package) so it can be reused wherever size
// matters and extended (e.g. volumetric_weight_kg) without touching
// unrelated messages.
message Dimensions {
  float length_cm = 1;
  float width_cm = 2;
  float height_cm = 3;
  float weight_kg = 4;
}
