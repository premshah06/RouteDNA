syntax = "proto3";

package packagepb.v1;

import "packagepb/v1/common.proto";
import "packagepb/v1/alert.proto";
import "packagepb/v1/item.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/example/thing-transfer/gen/packagepb/v1;packagepbv1";

// LiveFeedService is what Checkpoint 7's frontend subscribes to: one
// server-streaming RPC pushing both package position updates and
// alerts as they happen, so the UI never has to poll. This is the
// service the design docs describe as "the alert/query gRPC service
// the frontend subscribes to for live package positions and alerts."
//
// Backed by services/live_feed (Checkpoint 7): a lightweight consumer
// of scan-events (for positions) and alerts (forwarded as-is), holding
// only in-memory state — deliberately not durable, since history
// already lives in the lake/warehouse (Checkpoint 6). A client that
// reconnects gets a fresh snapshot of current positions plus the live
// stream going forward, not a replay of everything that ever happened.
service LiveFeedService {
  // One long-lived call: on connect, immediately emits a
  // PositionUpdate for every package currently known (a snapshot), then
  // streams PositionUpdate/Alert events as they occur. The client never
  // sends anything after the initial request — this is push-only, which
  // is why it's plain server-streaming rather than bidirectional.
  rpc Subscribe(SubscribeRequest) returns (stream LiveFeedEvent);

  // Point-in-time snapshot of every currently-tracked package's
  // position, for QueryService's ListParcels to merge with warehouse
  // alert history — Subscribe's snapshot-then-stream shape doesn't fit
  // a request/response caller that just wants "give me what you have
  // right now."
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);
}

message SubscribeRequest {
  // Empty for now — every client sees the whole facility. A future
  // per-station or per-package filter would go here without breaking
  // existing clients (proto3 default-empty fields).
}

message ListPositionsRequest {
  // Empty for now — this is an internal server-to-server call (only
  // services/query calls it today). A future per-station filter would
  // go here without breaking existing clients.
}

message ListPositionsResponse {
  repeated PositionUpdate positions = 1;
}

// Exactly one of these is set per event — modeled as a oneof for the
// same reason Alert.detail is: adding a new event kind later is a new
// oneof branch, not an ambiguous combination of optional fields.
message LiveFeedEvent {
  oneof event {
    PositionUpdate position_update = 1;
    Alert alert = 2;
  }
}

// A package's most recently known station. Emitted once per scan (not
// just on change) since a repeated scan at the same station is still
// meaningful liveness information for the UI (the package hasn't
// stalled) — the stuck-package detector, not this stream, is the
// source of truth for "has this gone quiet."
message PositionUpdate {
  string package_id = 1;
  StationType station = 2;
  google.protobuf.Timestamp updated_at = 3;

  // Resolved from the item_id ScanEvent carries in its attributes map
  // (see scan_event.proto) via the item catalog — empty if the source
  // event had no item_id or the catalog lookup missed. Denormalized
  // onto this message rather than making the frontend do a second
  // lookup, since this is a display-only convenience field and the
  // catalog is this service's own dependency, not the client's.
  string item_name = 4;

  // Same resolution path as item_name — lets the live view pick a
  // category-appropriate icon (box/bag/electronics/etc.) for a
  // traveling package without a second lookup. UNSPECIFIED if the
  // source event had no item_id or the catalog lookup missed.
  ItemCategory item_category = 5;

  // True when the ScanEvent that produced this update had
  // result == SCAN_RESULT_DAMAGE_DETECTED (see scan_event.proto).
  // Damage today only reaches the warehouse via the batch layer
  // (Checkpoint 8's daily_station_throughput) — no streaming job emits
  // an ALERT_TYPE_DAMAGE alert — so this is the only live signal of
  // damage the frontend has to compute a real-time damage rate from,
  // rather than one that's a full day stale.
  bool damage_detected = 6;
}
