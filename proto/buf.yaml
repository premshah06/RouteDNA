version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Subscribe/StreamScans/GetPackageJourney/GetFacilityStats
    # intentionally return existing domain messages (LiveFeedEvent,
    # RoutingInstruction, PackageJourney, FacilityStats) rather than a
    # dedicated <Method>Response wrapper, and StreamScans takes ScanEvent
    # directly as its request — these types are used pervasively
    # elsewhere (Kafka payloads, Flink jobs, every gRPC/frontend
    # consumer), so renaming them to satisfy this naming convention
    # would be a wide, purely cosmetic breaking change.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - FILE
