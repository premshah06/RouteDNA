x-flink-common: &flink-common
  image: thing-transfer-flink:local
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
  volumes:
    - ./gen/python:/opt/flink/usrlib/gen/python:ro
    - ./stream_processing/jobs:/opt/flink/usrlib/jobs:ro
    - ./services/common:/opt/flink/usrlib/services/common:ro

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: thing-transfer-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ThingTransferKRaftCluster1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka-topic-init:
    image: apache/kafka:3.8.0
    container_name: thing-transfer-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro

  flink-jobmanager:
    <<: *flink-common
    build:
      context: ./stream_processing/flink_image
    container_name: thing-transfer-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"

  flink-taskmanager:
    <<: *flink-common
    container_name: thing-transfer-flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: thing-transfer-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # native protocol
    environment:
      # The official image disables network access entirely for the
      # default user unless CLICKHOUSE_USER/PASSWORD are set — local-dev
      # credential, not meant to guard anything sensitive.
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: thing-transfer-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro

  live-feed:
    build:
      context: .
      dockerfile: services/live_feed/Dockerfile
    container_name: thing-transfer-live-feed
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    volumes:
      # Read-only: live-feed only resolves item_id -> name for display,
      # it never writes. Mounted rather than baked into the image so a
      # reseed (scripts/seed_catalog.py) doesn't need a rebuild.
      - ./data/catalog.db:/app/data/catalog.db:ro
    ports:
      - "50052:50052"

  query:
    build:
      context: .
      dockerfile: services/query/Dockerfile
    container_name: thing-transfer-query
    depends_on:
      clickhouse:
        condition: service_healthy
      live-feed:
        condition: service_started
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: thing-transfer-local
      LAKE_ROOT: /app/data/lake
      LIVE_FEED_URL: live-feed:50052
    volumes:
      # Read-only: query only reads the lake for scan history, it never writes.
      - ./data/lake:/app/data/lake:ro
    ports:
      - "50053:50053"

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: thing-transfer-envoy
    depends_on:
      - live-feed
      - query
    ports:
      - "8090:8080"  # grpc-web, browser-facing
      - "9901:9901"  # envoy admin
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro

  dagster:
    build:
      context: .
      dockerfile: batch/Dockerfile
    container_name: thing-transfer-dagster
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: thing-transfer-local
      LAKE_ROOT: /app/data/lake
      CATALOG_DB_PATH: /app/data/catalog.db
    volumes:
      # Both read-only: the batch layer reads the lake and catalog, it
      # never writes to either — all its output goes to ClickHouse.
      - ./data/lake:/app/data/lake:ro
      - ./data/catalog.db:/app/data/catalog.db:ro
      # Shared with dagster-daemon below — DAGSTER_HOME's run/event-log/
      # schedule SQLite storage has to be the same instance for both
      # processes, or the daemon's schedule ticks and the webserver's
      # view of runs diverge into two separate instances.
      - dagster-home:/app/dagster_home
    ports:
      - "3001:3000"  # 3000 avoided — commonly already bound on dev hosts

  # Runs daily_batch_schedule (thing_transfer_batch/__init__.py, 00:30
  # UTC) — the webserver alone only serves the UI/GraphQL API and never
  # executes anything on its own; the daemon is the process that
  # actually watches schedules/sensors and launches runs. Same image,
  # same code/data mounts, same DAGSTER_HOME as the webserver above so
  # they operate as one instance.
  dagster-daemon:
    build:
      context: .
      dockerfile: batch/Dockerfile
    container_name: thing-transfer-dagster-daemon
    command: dagster-daemon run
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: thing-transfer-local
      LAKE_ROOT: /app/data/lake
      CATALOG_DB_PATH: /app/data/catalog.db
    volumes:
      - ./data/lake:/app/data/lake:ro
      - ./data/catalog.db:/app/data/catalog.db:ro
      - dagster-home:/app/dagster_home

volumes:
  kafka-data:
  clickhouse-data:
  dagster-home:
